name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Also build the PULSE.app bundle artifact"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    # A release commit (subject starting with the tag) is empty — the Release workflow compiles and smoke-tests
    # the same tree — so CI stays out of its way: GitHub hands this account one Apple-silicon macOS machine at a time, and a job that waits
    # more than 15 minutes for one is cancelled and marks its run failed.
    if: ${{ !startsWith(github.event.head_commit.message, '[release]') }}
    # One job per runner pool, no more: Apple silicon (macos-26, Xcode 26 / Swift 6.2) and Intel (macos-15-intel,
    # Xcode 16 / Swift 6.0) run side by side because the pools are separate. A third macOS job queued at the
    # same time sat behind the first and was cancelled after the 15-minute wait (macos-14 got a machine once in
    # a dozen runs, macos-15 the same once the oldest image was dropped), and every such cancellation showed up
    # as a failed run. The app still runs on macOS 14: that deployment target is in Package.swift and both
    # images enforce it when they compile.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # Images keep several Xcodes; use the newest 16.x (Swift 6.0/6.1) where one exists so builds match
          # across runners; macos-26 only ships Xcode 26 (Swift 6.2), which also builds this package.
          newest=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ matrix.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ matrix.os }}-${{ hashFiles('Package.swift') }}-

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: .models
          key: whisper-ggml-tiny-en-v1

      - name: Install whisper.cpp (transcription test)
        continue-on-error: true
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install whisper-cpp >/dev/null 2>&1 || brew install whisper-cpp
          mkdir -p .models
          if [ ! -f .models/ggml-tiny.en.bin ]; then
            curl -fsSL -o .models/ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          fi
          ls -la .models /opt/homebrew/bin/whisper* || true

      - name: Build
        id: build
        run: |
          set +e
          swift build --build-tests 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "================ COMPILER ERRORS ================"
            grep -E "error:" build.log | sort -u | head -200
          fi
          exit $status

      - name: Test
        env:
          PULSE_WHISPER_MODEL: ${{ github.workspace }}/.models/ggml-tiny.en.bin
        run: |
          set +e
          swift test --skip-build 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "================ TEST FAILURES ================"
            grep -E "error:|failed|Fatal|crash" test.log | head -200
          fi
          exit $status

      - name: UI snapshots
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          if [ ! -x .build/debug/PULSE ]; then echo "PULSE executable not built"; exit 0; fi
          mkdir -p build/ui
          # The viewer's rendered frames are compared with the ones kept here (see docs/VIEWER-FRAMES.md).
          PULSE_FRAME_REFERENCE="$PWD/.github/viewer-frames.json" .build/debug/PULSE --ui-snapshots "$PWD/build/ui" > ui.log 2>&1 &
          pid=$!
          for i in $(seq 1 780); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          hung=0
          if kill -0 $pid 2>/dev/null; then
            # Still running after thirteen minutes: the walk-through is stuck. Record where before stopping it.
            hung=1
            sudo sample $pid 3 -file hang-sample.log >/dev/null 2>&1 || sample $pid 3 -file hang-sample.log >/dev/null 2>&1 || true
          fi
          kill $pid 2>/dev/null || true
          ls -la build/ui || true
          grep "^UI-" ui.log || true
          tail -50 ui.log || true
          if [ $hung -eq 1 ]; then
            echo "================ MAIN THREAD WHEN THE WALK-THROUGH STOPPED RESPONDING ================"
            awk '/Call graph:/{p=1} /Thread_[0-9]+/{n++} n>=2{exit} p{print}' hang-sample.log | cut -c1-240 | tail -160 || true
            # A main thread that is only waiting for events means the stall is elsewhere: show what PULSE's own code is doing.
            echo "================ THREADS INSIDE PULSE'S OWN CODE ================"
            grep -n "(in PULSE)" hang-sample.log | cut -c1-220 | head -60 || true
            echo "::error::The UI walk-through did not finish in 13 minutes ($(ls build/ui/*.png 2>/dev/null | wc -l | tr -d ' ') captures made)"
            exit 1
          fi
          # The frames the viewer really rendered. A changed picture is a warning to look at; a black, flat or
          # misshapen frame, or one that is nothing like the reference, fails the run.
          grep "^UI-FRAME-CHANGED" ui.log | while read -r line; do echo "::warning::The viewer's picture changed: ${line#UI-FRAME-CHANGED }"; done || true
          if grep -q "^UI-FRAME-FAIL" ui.log; then
            grep "^UI-FRAME-FAIL" ui.log | while read -r line; do echo "::error::The viewer rendered the wrong picture: ${line#UI-FRAME-FAIL }"; done
            exit 1
          fi
          # This runner has a GPU, so the walk-through reaches the editor: no judged frame at all means the check itself broke.
          if [ "$EXPECT_FRAMES" = "1" ] && ! grep -q "^UI-FRAME " ui.log; then
            echo "::error::The walk-through finished without rendering a single viewer frame"
            exit 1
          fi
        env:
          EXPECT_FRAMES: ${{ matrix.os == 'macos-26' && '1' || '0' }}

      # The owner's personal dev configuration (-DPULSE_DEV, the Claude Code bridge) is never released, so
      # nothing above compiles it. It is built and its tests run here, in its own build folder, so it
      # cannot rot unnoticed. One runner is enough.
      - name: Cache dev configuration build
        if: ${{ matrix.os == 'macos-26' }}
        uses: actions/cache@v4
        with:
          path: .build-dev
          key: spm-dev-${{ matrix.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-dev-${{ matrix.os }}-${{ hashFiles('Package.swift') }}-

      - name: Dev configuration builds and passes its tests
        if: ${{ matrix.os == 'macos-26' && steps.build.outcome == 'success' }}
        run: |
          set +e
          swift build --build-tests --build-path .build-dev -Xswiftc -DPULSE_DEV 2>&1 | tee build-dev.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "================ COMPILER ERRORS (dev configuration) ================"
            grep -E "error:" build-dev.log | sort -u | head -200
            exit $status
          fi
          swift test --skip-build --build-path .build-dev -Xswiftc -DPULSE_DEV --filter "ClaudeCode|DevBuildGate|StyleStudy" 2>&1 | tee test-dev.log
          status=${PIPESTATUS[0]}
          grep -E "Executed [0-9]+ tests" test-dev.log | tail -1
          # The bridge must be in this build and must not be in the one that ships.
          dev_bin="$(swift build --build-path .build-dev -Xswiftc -DPULSE_DEV --show-bin-path)/PULSE"
          pub_bin="$(swift build --show-bin-path)/PULSE"
          if ! LC_ALL=C grep -q "pulse.dev.claude-code" "$dev_bin"; then echo "DEV-GATE-FAIL the dev build has no Claude Code bridge"; status=1; fi
          if LC_ALL=C grep -q "pulse.dev.claude-code" "$pub_bin"; then echo "DEV-GATE-FAIL the public build contains the Claude Code bridge"; status=1; fi
          [ $status -eq 0 ] && echo "DEV-GATE-OK bridge present in the dev build, absent from the public build"
          exit $status

      - name: Build PULSE.app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle || contains(github.event.head_commit.message, '[app]') }}
        run: ./scripts/build-app.sh

      - name: Upload PULSE.app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle || contains(github.event.head_commit.message, '[app]') }}
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-app-${{ matrix.os }}
          path: build/PULSE.zip
          if-no-files-found: ignore

      - name: Upload logs & snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output-${{ matrix.os }}
          path: |
            *.log
            build/snapshots/*.png
            build/ui/*.png
            build/ui/viewer-frames.json
          if-no-files-found: ignore

      - name: Print snapshots (base64 thumbnails for remote review)
        if: always()
        run: |
          shopt -s nullglob
          for f in build/snapshots/*.png; do
            sips -Z 360 -s format jpeg -s formatOptions 50 "$f" --out /tmp/snap.jpg >/dev/null 2>&1 || continue
            echo "SNAPSHOT $(basename "$f") $(base64 -i /tmp/snap.jpg | tr -d '\n')"
          done
          for f in build/ui/*.png; do
            sips -Z 1280 -s format jpeg -s formatOptions 55 "$f" --out /tmp/snap.jpg >/dev/null 2>&1 || continue
            echo "SNAPSHOT ui-$(basename "$f") $(base64 -i /tmp/snap.jpg | tr -d '\n')"
          done

name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Also build the PULSE.app bundle artifact"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    # A release commit (subject starting with the tag) is empty — the Release workflow compiles and smoke-tests
    # the same tree — so CI stays out of its way: GitHub hands this account one Apple-silicon macOS machine at a time, and a job that waits
    # more than 15 minutes for one is cancelled and marks its run failed.
    if: ${{ !startsWith(github.event.head_commit.message, '[release]') }}
    # One job per runner pool, no more: Apple silicon (macos-26, Xcode 26 / Swift 6.2) and Intel (macos-15-intel,
    # Xcode 16 / Swift 6.0) run side by side because the pools are separate. A third macOS job queued at the
    # same time sat behind the first and was cancelled after the 15-minute wait (macos-14 got a machine once in
    # a dozen runs, macos-15 the same once the oldest image was dropped), and every such cancellation showed up
    # as a failed run. The app still runs on macOS 14: that deployment target is in Package.swift and both
    # images enforce it when they compile.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          # Images keep several Xcodes; use the newest 16.x (Swift 6.0/6.1) where one exists so builds match
          # across runners; macos-26 only ships Xcode 26 (Swift 6.2), which also builds this package.
          newest=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ matrix.os }}-${{ hashFiles('Package.swift') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ matrix.os }}-${{ hashFiles('Package.swift') }}-

      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: .models
          key: whisper-ggml-tiny-en-v1

      - name: Install whisper.cpp (transcription test)
        continue-on-error: true
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install whisper-cpp >/dev/null 2>&1 || brew install whisper-cpp
          mkdir -p .models
          if [ ! -f .models/ggml-tiny.en.bin ]; then
            curl -fsSL -o .models/ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          fi
          ls -la .models /opt/homebrew/bin/whisper* || true

      - name: Build
        id: build
        run: |
          set +e
          swift build --build-tests 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "================ COMPILER ERRORS ================"
            grep -E "error:" build.log | sort -u | head -200
          fi
          exit $status

      - name: Test
        env:
          PULSE_WHISPER_MODEL: ${{ github.workspace }}/.models/ggml-tiny.en.bin
        run: |
          set +e
          swift test --skip-build 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "================ TEST FAILURES ================"
            grep -E "error:|failed|Fatal|crash" test.log | head -200
          fi
          exit $status

      - name: UI snapshots
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          if [ ! -x .build/debug/PULSE ]; then echo "PULSE executable not built"; exit 0; fi
          mkdir -p build/ui
          .build/debug/PULSE --ui-snapshots "$PWD/build/ui" > ui.log 2>&1 &
          pid=$!
          for i in $(seq 1 600); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la build/ui || true
          grep "^UI-" ui.log || true
          tail -50 ui.log || true

      - name: Build PULSE.app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle || contains(github.event.head_commit.message, '[app]') }}
        run: ./scripts/build-app.sh

      - name: Upload PULSE.app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle || contains(github.event.head_commit.message, '[app]') }}
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-app-${{ matrix.os }}
          path: build/PULSE.zip
          if-no-files-found: ignore

      - name: Upload logs & snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output-${{ matrix.os }}
          path: |
            *.log
            build/snapshots/*.png
            build/ui/*.png
          if-no-files-found: ignore

      - name: Print snapshots (base64 thumbnails for remote review)
        if: always()
        run: |
          shopt -s nullglob
          for f in build/snapshots/*.png; do
            sips -Z 360 -s format jpeg -s formatOptions 50 "$f" --out /tmp/snap.jpg >/dev/null 2>&1 || continue
            echo "SNAPSHOT $(basename "$f") $(base64 -i /tmp/snap.jpg | tr -d '\n')"
          done
          for f in build/ui/*.png; do
            sips -Z 1280 -s format jpeg -s formatOptions 55 "$f" --out /tmp/snap.jpg >/dev/null 2>&1 || continue
            echo "SNAPSHOT ui-$(basename "$f") $(base64 -i /tmp/snap.jpg | tr -d '\n')"
          done
